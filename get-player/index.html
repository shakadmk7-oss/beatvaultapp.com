<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get BeatVault Music Player</title>
<!-- Short link for sharing: forwards to the Google Play listing with a campaign tag, so
     Play Console (Statistics, Acquisition) shows which post or channel brought each install.
     Share it as /get-player/?c=twitch, ?c=reddit-djs, ?c=discord and so on (letters,
     numbers and dashes, up to 40). The tag becomes utm_source; utm_campaign is "short-link".
     No ?c= tags the visit "short-link".
     If the package name ever changes, update com.beatvault.dj everywhere below. -->
<link rel="canonical" href="https://play.google.com/store/apps/details?id=com.beatvault.dj">
<noscript><meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.beatvault.dj&amp;referrer=utm_source%3Dshort-link%26utm_campaign%3Dshort-link"></noscript>
<meta name="robots" content="noindex">
<meta property="og:title" content="BeatVault Music Player for Android">
<meta property="og:description" content="Offline music player for Android that plays the music files already on your phone. BPM and key tools, crossfade, Beat Blend and Android Auto. No ads. Free on Google Play.">
<meta property="og:image" content="https://beatvaultapp.com/img/og-player.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://beatvaultapp.com/img/og-player.jpg">
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var c = (q.get("c") || q.get("cid") || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 40) || "short-link";
  location.replace("https://play.google.com/store/apps/details?id=com.beatvault.dj&referrer=" +
    encodeURIComponent("utm_source=" + c + "&utm_campaign=short-link"));
})();
</script>
</head>
<body style="background:#0b0710;color:#f2ecf8;font-family:system-ui,sans-serif;padding:40px 16px">
<p>Taking you to BeatVault Music Player on Google Play…</p>
<p>If nothing happens, <a href="https://play.google.com/store/apps/details?id=com.beatvault.dj&amp;referrer=utm_source%3Dshort-link%26utm_campaign%3Dshort-link" style="color:#b026ff">open it on Google Play</a>.</p>
</body>
</html>
