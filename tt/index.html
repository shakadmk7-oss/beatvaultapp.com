<title>Get BeatVault DeckDisplay</title>
<!-- Bio link for tiktok (beatvaultapp.com/tt): the same as /get-deckdisplay/?c=tiktok, short enough to type. Short link for sharing: forwards to the Microsoft Store listing with a campaign tag, so
     Partner Center (Insights, Acquisitions) shows which post or channel brought each visit.
     Share it as /get-deckdisplay/?c=tiktok, ?c=reddit-djs, ?c=discord and so on (letters,
     numbers and dashes, up to 40). No ?c= tags the visit "short-link".
     If the Store link ever changes, update the product ID (9NHFFBG2S44F) everywhere below. -->
<link rel="canonical" href="https://apps.microsoft.com/detail/9NHFFBG2S44F">
<noscript><meta http-equiv="refresh" content="0; url=https://apps.microsoft.com/detail/9NHFFBG2S44F?cid=tiktok"></noscript>
<meta name="robots" content="noindex">
<meta property="og:title" content="BeatVault DeckDisplay: Now Playing Overlay for DJ Streams">
<meta property="og:description" content="Now playing overlay for DJ live streams on Windows: shows the track you're playing in Serato DJ, VirtualDJ or Rekordbox in OBS, automatically. Free 28-day trial on the Microsoft Store.">
<meta property="og:image" content="https://beatvaultapp.com/img/og-beatvault.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://beatvaultapp.com/img/og-beatvault.jpg">
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var c = (q.get("c") || q.get("cid") || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 40) || "tiktok";
  location.replace("https://apps.microsoft.com/detail/9NHFFBG2S44F?cid=" + c);
})();
</script>
